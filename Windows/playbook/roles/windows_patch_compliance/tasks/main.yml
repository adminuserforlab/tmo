- name: Create fact directory
  ansible.windows.win_file:
    path: "{{ patch_compliance_fact_file | win_dirname }}"
    state: directory

- name: Check if fact file exists
  ansible.windows.win_stat:
    path: "{{ patch_compliance_fact_file }}"
  register: fact_stat

- name: Read fact file
  ansible.windows.win_shell: |
    Get-Content "{{ patch_compliance_fact_file }}"
  register: fact_content
  when: fact_stat.stat.exists

- name: Parse existing facts
  set_fact:
    patch_facts: "{{ fact_content.stdout | from_json }}"
  when: fact_stat.stat.exists

- name: Initialize days_since_patch
  set_fact:
    days_since_patch: >-
      {{
        patch_facts.days_since_patch
        if patch_facts is defined and
        patch_facts.days_since_patch is defined
        else 0
      }}

- name: search Windows updates
  ansible.windows.win_updates:
    state: searched
  register: update_result

- name: Mark system patched
  set_fact:
    patched: true
    days_since_patch: 0
  when: update_result.found_update_count == 0

- name: Mark system unpatched
  set_fact:
    patched: false
    days_since_patch: "{{ days_since_patch | int + 1 }}"
  when: update_result.found_update_count != 0

- name: Set patch facts
  set_fact:
    patched_over30: "{{ (days_since_patch | int) > 30 }}"

- name: Save patch facts
  ansible.windows.win_copy:
    dest: "{{ patch_compliance_fact_file }}"
    content: |
      {
        "Patched": {{ patched | to_json }},
        "days_since_patch": {{ days_since_patch | to_json }},
        "patched_over30": {{ patched_over30 | to_json }}
      }

- name: Show patch status
  debug:
    msg:
      - "Patched: {{ patched }}"
      - "days_since_patch: {{ days_since_patch }}"
      - "patched_over30: {{ patched_over30 }}"
      - "available_updates: {{ update_result.found_update_count }}"
