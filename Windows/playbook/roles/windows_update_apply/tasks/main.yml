---
- name: Search and install critical and security updates
  ansible.windows.win_updates:
    category_names:
      - CriticalUpdates
      - SecurityUpdates
    state: installed
  register: update_result

- name: Reboot if required after updates
  ansible.windows.win_reboot:
    reboot_timeout: 3600
  when: update_result.reboot_required
