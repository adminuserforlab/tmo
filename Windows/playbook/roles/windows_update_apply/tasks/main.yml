---

- name: Read current WSUS server configuration
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
    name: WUServer
  register: wsus_reg

- name: Configure WSUS server
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
    name: WUServer
    data: "{{ wsus_url }}"
    type: string
  when: >
    not wsus_reg.exists or
    wsus_reg.value != wsus_url

- name: Configure WSUS status server
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
    name: WUStatusServer
    data: "{{ wsus_url }}"
    type: string
  when: >
    not wsus_reg.exists or
    wsus_reg.value != wsus_url

- name: Enable WSUS usage
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: UseWUServer
    data: 1
    type: dword

- name: Force Group Policy update
  ansible.windows.win_command: gpupdate /force
  when: >
    not wsus_reg.exists or
    wsus_reg.value != wsus_url

- name: Search, download
  ansible.windows.win_updates:
    category_names:
      - CriticalUpdates
      - SecurityUpdates
    state: installed
  register: update_result

- name: Reboot if required after updates
  ansible.windows.win_reboot:
    reboot_timeout: 3600
  when: update_result.reboot_required

- ⁠name: Configure Windows Update proxy behavior
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
    name: SetProxyBehaviorForUpdateDetection
    data: 0
    type: dword

- name: Set CorpWUFillEmptyContentUrls
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
    name: CorpWUFillEmptyContentUrls
    data: 1
    type: dword

- name: Disable CorpWUDoNotEnforceEnterpriseTLSCertPinningForUpdateDetection
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
    name: CorpWUDoNotEnforceEnterpriseTLSCertPinningForUpdateDetection
    data: 1
    type: dword

