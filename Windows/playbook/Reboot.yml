---
- name: Reboot Windows server
  hosts: all
  gather_facts: false

  tasks:
    - name: Reboot the server
      ansible.windows.win_reboot:
        reboot_timeout: 3600
        pre_reboot_delay: 30
        post_reboot_delay: 60
        msg: "Reboot initiated by AAP"
        test_command: "whoami"

    - name: confirm server is back online
      ansible.windows.win_ping:

    - name: Report reboot success
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} rebooted successfully"